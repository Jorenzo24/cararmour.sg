        <figure class="range" data-reveal="1" aria-label="Typical lifespan of paint protection. Carnauba wax: 1 to 2 months. Synthetic sealant: 4 to 6 months. Ceramic coating: 2 to 5 years. Nano graphene coating: 3 to 7 years.">
