# Publication de la préproduction sur GitHub Pages.
#
# Le pipeline historique de Pages, qui lisait directement une branche,
# échouait de façon répétée sans message exploitable. Celui-ci construit le
# site dans le runner et le publie comme artefact : un seul mécanisme, pas de
# branche intermédiaire, et un journal consultable en cas d'échec.
name: Préproduction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Générer le site en sous-chemin, non indexable
        run: |
          python3 _src/build.py --base /cararmour.sg --noindex --out _site
          cp -R assets/fonts assets/img assets/js _site/assets/
          cp assets/css/styleguide.css _site/assets/css/
          cp favicon.ico _site/
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          cp _src/preview-readme.md _site/README.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
